openapi: 3.0.3
info:
  title: Sera AI Chatbot API
  version: 0.1.0
  description: |
    Privy で認証された利用者向けの Sera AI チャットボット契約。
    OpenAPI Generator 7.25.0 の typescript-fetch client を生成対象とする。
servers:
  - url: https://sera-ai-api-{stage}.workers.dev
    variables:
      stage:
        default: dev
security:
  - privyBearer: []
tags:
  - name: system
  - name: wallet
  - name: market
  - name: chat
  - name: transaction
paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Worker は request を受け付けられる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      responses:
        '200':
          description: runtime で確認済みの network/token/market/operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        default:
          $ref: '#/components/responses/Problem'
  /v1/wallets/me:
    get:
      tags: [wallet]
      operationId: getMyWallet
      responses:
        '200':
          description: 認証利用者が所有する wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [wallet]
      operationId: registerMyWallet
      description: Privy で作成済みの embedded wallet を検証し、所有関係を同期する。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWalletRequest'
      responses:
        '200':
          description: 既存 wallet を返した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '201':
          description: ownership projection を作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        default:
          $ref: '#/components/responses/Problem'
  /v1/wallets/me/balances:
    get:
      tags: [wallet]
      operationId: getMyBalances
      responses:
        '200':
          description: Sera から取得した残高
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceList'
        default:
          $ref: '#/components/responses/Problem'
  /v1/markets:
    get:
      tags: [market]
      operationId: listMarkets
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
            example: JPYC/USDC
        - name: includeSyntheticDepth
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 市場と、要求時のみ quote-based synthetic depth
          content:
            application/json:
              schema:
                type: object
                required: [items, fetchedAt, source]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Market'
                  fetchedAt:
                    type: string
                    format: date-time
                  source:
                    type: string
                    enum: [SERA]
        default:
          $ref: '#/components/responses/Problem'
  /v1/conversations:
    post:
      tags: [chat]
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '201':
          description: conversation を作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/conversations/{conversationId}:
    get:
      tags: [chat]
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: 自分の conversation と messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/conversations/{conversationId}/messages:
    post:
      tags: [chat]
      operationId: createMessageRun
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 20000
      responses:
        '202':
          description: Agent run を受け付けた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        default:
          $ref: '#/components/responses/Problem'
  /v1/agent-runs/{runId}:
    get:
      tags: [chat]
      operationId: getAgentRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: run の durable status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/agent-runs/{runId}/events:
    get:
      tags: [chat]
      operationId: streamAgentRunEvents
      description: 詳細 wire contract は `sse-events.md`。`Last-Event-ID` または after で再開する。
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Server-Sent Events
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /v1/transaction-proposals:
    post:
      tags: [transaction]
      operationId: createTransactionProposal
      description: deterministic service が Sera quote/build を検証して承認対象を固定する。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: 同じ transaction で作成した承認待ち proposal と operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTransactionProposalResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/transaction-proposals/{proposalId}:
    get:
      tags: [transaction]
      operationId: getTransactionProposal
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: 自分の proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionProposal'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/transaction-proposals/{proposalId}/decision:
    post:
      tags: [transaction]
      operationId: recordTransactionProposalDecision
      description: 利用者による拒否または取消をバックエンドの状態と監査イベントへ記録する。
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionDecisionRequest'
      responses:
        '200':
          description: 記録済み decision と同じ operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDecisionResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/transaction-proposals/{proposalId}/approval-request:
    post:
      tags: [transaction]
      operationId: createApprovalRequest
      description: owner/hash/version/expiry を再検証して、client が署名する exact payload を返す。
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposalVersion, proposalHash]
              properties:
                proposalVersion:
                  type: integer
                  minimum: 1
                proposalHash:
                  $ref: '#/components/schemas/Hash'
      responses:
        '200':
          description: 署名対象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/transaction-proposals/{proposalId}/execute:
    post:
      tags: [transaction]
      operationId: executeTransactionProposal
      description: 同じ idempotency key は同じ Operation を返す。broadcast の winner は最大1 request。
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteProposalRequest'
      responses:
        '202':
          description: 送信または追跡を受け付けた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/operations/{operationId}:
    get:
      tags: [transaction]
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: 検証可能な根拠を持つ operation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/operations/{operationId}/recheck:
    post:
      tags: [transaction]
      operationId: recheckOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 再 broadcast せず確認 Workflow を開始または既存 run を返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/operations/{operationId}/audit-events:
    get:
      tags: [transaction]
      operationId: listOperationAuditEvents
      description: 所有者だけが、secret-free な proposal・decision・approval・sign・submit・status の監査イベントを時系列で取得する。
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: operation に紐づく監査イベント
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    privyBearer:
      type: http
      scheme: bearer
      bearerFormat: Privy access token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 compatible error。secret、token、upstream raw body を含めない。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required: [status, time, version]
      properties:
        status: { type: string, enum: [ok] }
        time: { type: string, format: date-time }
        version: { type: string }
    Hash:
      type: string
      pattern: '^0x[0-9a-fA-F]{64}$'
    EvmAddress:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
    DecimalInteger:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        correlationId: { type: string }
        retryable: { type: boolean, default: false }
    Capabilities:
      type: object
      required: [network, chainId, tokens, markets, operations, fetchedAt, expiresAt]
      properties:
        network: { type: string, enum: [SEPOLIA] }
        chainId: { type: integer, enum: [11155111] }
        tokens:
          type: array
          items: { $ref: '#/components/schemas/Token' }
        markets:
          type: array
          items: { type: string, example: JPYC/USDC }
        operations:
          type: array
          items: { type: string, enum: [BALANCE, MARKET, SYNTHETIC_DEPTH, ORDER_HISTORY, SWAP, TRANSFER, STATUS] }
        fetchedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Token:
      type: object
      required: [address, symbol, decimals]
      properties:
        address: { $ref: '#/components/schemas/EvmAddress' }
        symbol: { type: string, minLength: 1, maxLength: 16 }
        decimals: { type: integer, minimum: 0, maximum: 255 }
    Wallet:
      type: object
      required: [id, address, chainId, network, walletType, verifiedAt]
      properties:
        id: { type: string, format: uuid }
        address: { $ref: '#/components/schemas/EvmAddress' }
        chainId: { type: integer, enum: [11155111] }
        network: { type: string, enum: [SEPOLIA] }
        walletType: { type: string, enum: [PRIVY_EMBEDDED_USER_OWNED] }
        verifiedAt: { type: string, format: date-time }
    RegisterWalletRequest:
      type: object
      required: [privyWalletId, address, chainId]
      properties:
        privyWalletId: { type: string, minLength: 1, maxLength: 256 }
        address: { $ref: '#/components/schemas/EvmAddress' }
        chainId: { type: integer, enum: [11155111] }
    BalanceList:
      type: object
      additionalProperties: false
      required: [walletAddress, chainId, blockNumber, items, fetchedAt, source]
      properties:
        walletAddress: { $ref: '#/components/schemas/EvmAddress' }
        chainId: { type: integer, enum: [11155111] }
        blockNumber: { type: string, pattern: '^[0-9]+$' }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [token, amountRaw, amount]
            properties:
              token: { $ref: '#/components/schemas/Token' }
              amountRaw: { $ref: '#/components/schemas/DecimalInteger' }
              amount: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        fetchedAt: { type: string, format: date-time }
        source: { type: string, enum: [ETHEREUM_RPC] }
    Market:
      type: object
      required: [symbol, base, quote, informationKind]
      properties:
        symbol: { type: string, example: JPYC/USDC }
        base: { $ref: '#/components/schemas/Token' }
        quote: { $ref: '#/components/schemas/Token' }
        informationKind: { type: string, enum: [MARKET_METADATA, QUOTE, SYNTHETIC_DEPTH] }
        depth:
          type: array
          description: authoritative order book ではなく quote-based estimate
          items:
            type: object
            required: [side, inputAmountRaw, outputAmountRaw, price]
            properties:
              side: { type: string, enum: [BID, ASK] }
              inputAmountRaw: { $ref: '#/components/schemas/DecimalInteger' }
              outputAmountRaw: { $ref: '#/components/schemas/DecimalInteger' }
              price: { type: string }
    Conversation:
      type: object
      required: [id, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [ACTIVE, CLOSED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                type: object
                required: [id, role, content, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [USER, ASSISTANT, TOOL_SUMMARY, SYSTEM_NOTICE] }
                  content: { type: string }
                  createdAt: { type: string, format: date-time }
    AgentRun:
      type: object
      required: [id, conversationId, status, eventsUrl]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, STREAMING, COMPLETED, FAILED, CANCELLED] }
        eventsUrl: { type: string, format: uri-reference }
        errorCode: { type: string }
    CreateProposalRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateSwapProposalRequest'
        - $ref: '#/components/schemas/CreateTransferProposalRequest'
      discriminator:
        propertyName: kind
    CreateSwapProposalRequest:
      type: object
      additionalProperties: false
      required: [kind, inputTokenAddress, outputTokenAddress, inputAmountRaw, maxSlippageBps]
      properties:
        kind: { type: string, enum: [SWAP] }
        inputTokenAddress: { $ref: '#/components/schemas/EvmAddress' }
        outputTokenAddress: { $ref: '#/components/schemas/EvmAddress' }
        inputAmountRaw: { $ref: '#/components/schemas/DecimalInteger' }
        maxSlippageBps: { type: integer, minimum: 0, maximum: 10000 }
        conversationId: { type: string, format: uuid }
    CreateTransferProposalRequest:
      type: object
      additionalProperties: false
      required: [kind, tokenAddress, amountRaw, recipient]
      properties:
        kind: { type: string, enum: [TRANSFER] }
        tokenAddress: { $ref: '#/components/schemas/EvmAddress' }
        amountRaw: { $ref: '#/components/schemas/DecimalInteger' }
        recipient: { $ref: '#/components/schemas/EvmAddress' }
        conversationId: { type: string, format: uuid }
    CreateTransactionProposalResponse:
      type: object
      additionalProperties: false
      required: [proposal, operation]
      properties:
        proposal:
          $ref: '#/components/schemas/TransactionProposal'
        operation:
          $ref: '#/components/schemas/Operation'
    Fee:
      type: object
      additionalProperties: false
      required: [assetSymbol, amountRaw, source]
      properties:
        assetSymbol: { type: string, minLength: 1, maxLength: 16 }
        tokenAddress: { $ref: '#/components/schemas/EvmAddress' }
        amountRaw: { $ref: '#/components/schemas/DecimalInteger' }
        source: { type: string, enum: [SERA_QUOTE, SERA_TRANSFER, ETHEREUM_RPC] }
    TransactionProposal:
      oneOf:
        - $ref: '#/components/schemas/SwapProposal'
        - $ref: '#/components/schemas/TransferProposal'
      discriminator:
        propertyName: kind
        mapping:
          SWAP: '#/components/schemas/SwapProposal'
          TRANSFER: '#/components/schemas/TransferProposal'
    SwapProposal:
      type: object
      additionalProperties: false
      required: [id, operationId, kind, version, proposalHash, network, chainId, fromAddress, inputToken, outputToken, inputAmountRaw, expectedOutputAmountRaw, fee, maxSlippageBps, quoteId, quoteExpiresAt, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        kind: { type: string, enum: [SWAP] }
        version: { type: integer, minimum: 1 }
        proposalHash: { $ref: '#/components/schemas/Hash' }
        network: { type: string, enum: [SEPOLIA] }
        chainId: { type: integer, enum: [11155111] }
        fromAddress: { $ref: '#/components/schemas/EvmAddress' }
        inputToken: { $ref: '#/components/schemas/Token' }
        outputToken: { $ref: '#/components/schemas/Token' }
        inputAmountRaw: { $ref: '#/components/schemas/DecimalInteger' }
        expectedOutputAmountRaw: { $ref: '#/components/schemas/DecimalInteger' }
        fee: { $ref: '#/components/schemas/Fee' }
        maxSlippageBps: { type: integer, minimum: 0, maximum: 10000 }
        quoteId: { type: string, minLength: 1, maxLength: 256 }
        quoteExpiresAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    TransferProposal:
      type: object
      additionalProperties: false
      required: [id, operationId, kind, version, proposalHash, network, chainId, fromAddress, recipient, token, amountRaw, fee, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        kind: { type: string, enum: [TRANSFER] }
        version: { type: integer, minimum: 1 }
        proposalHash: { $ref: '#/components/schemas/Hash' }
        network: { type: string, enum: [SEPOLIA] }
        chainId: { type: integer, enum: [11155111] }
        fromAddress: { $ref: '#/components/schemas/EvmAddress' }
        recipient: { $ref: '#/components/schemas/EvmAddress' }
        token: { $ref: '#/components/schemas/Token' }
        amountRaw: { $ref: '#/components/schemas/DecimalInteger' }
        fee: { $ref: '#/components/schemas/Fee' }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    TransactionDecisionRequest:
      type: object
      additionalProperties: false
      required: [proposalVersion, proposalHash, decision]
      properties:
        proposalVersion: { type: integer, minimum: 1 }
        proposalHash: { $ref: '#/components/schemas/Hash' }
        decision: { type: string, enum: [REJECT, CANCEL] }
    TransactionDecisionResponse:
      type: object
      additionalProperties: false
      required: [proposalId, operationId, decision, operation]
      properties:
        proposalId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        decision: { type: string, enum: [REJECT, CANCEL] }
        operation: { $ref: '#/components/schemas/Operation' }
    ApprovalRequest:
      oneOf:
        - $ref: '#/components/schemas/Eip712ApprovalRequest'
        - $ref: '#/components/schemas/PrivyAuthorizationRequest'
      discriminator:
        propertyName: kind
        mapping:
          EIP712_SIGNATURE: '#/components/schemas/Eip712ApprovalRequest'
          PRIVY_REQUEST_SIGNATURE: '#/components/schemas/PrivyAuthorizationRequest'
    Eip712ApprovalRequest:
      type: object
      additionalProperties: false
      required: [approvalId, operationId, kind, proposalHash, expiresAt, canonicalTypedDataJson, digest]
      properties:
        approvalId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        kind: { type: string, enum: [EIP712_SIGNATURE] }
        proposalHash: { $ref: '#/components/schemas/Hash' }
        expiresAt: { type: string, format: date-time }
        canonicalTypedDataJson:
          type: string
          minLength: 2
          maxLength: 65536
          description: server が Sera schema で検証し canonicalize した EIP-712 JSON。client は内容を変更せず署名する。
        digest: { $ref: '#/components/schemas/Hash' }
    PrivyAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [approvalId, operationId, kind, proposalHash, expiresAt, walletId, method, chainId, serializedRequest, requestBodyHash, privyIdempotencyKey]
      properties:
        approvalId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        kind: { type: string, enum: [PRIVY_REQUEST_SIGNATURE] }
        proposalHash: { $ref: '#/components/schemas/Hash' }
        expiresAt: { type: string, format: date-time }
        walletId: { type: string, minLength: 1, maxLength: 256 }
        method: { type: string, enum: [eth_sendTransaction] }
        chainId: { type: integer, enum: [11155111] }
        serializedRequest:
          type: string
          minLength: 2
          maxLength: 65536
          description: client authorization の対象となる exact serialized Privy request。
        requestBodyHash: { $ref: '#/components/schemas/Hash' }
        privyIdempotencyKey: { type: string, minLength: 16, maxLength: 128 }
    ExecuteProposalRequest:
      type: object
      additionalProperties: false
      required: [approvalId, proposalVersion, proposalHash, authorization]
      properties:
        approvalId: { type: string, format: uuid }
        proposalVersion: { type: integer, minimum: 1 }
        proposalHash: { $ref: '#/components/schemas/Hash' }
        authorization:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, signature]
              properties:
                kind: { type: string, enum: [EIP712_SIGNATURE] }
                signature: { type: string, pattern: '^0x[0-9a-fA-F]+$' }
            - type: object
              additionalProperties: false
              required: [kind, signature]
              properties:
                kind: { type: string, enum: [PRIVY_REQUEST_SIGNATURE] }
                signature: { type: string, minLength: 1, maxLength: 8192 }
    Operation:
      type: object
      additionalProperties: false
      required: [id, proposalId, kind, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        proposalId: { type: string, format: uuid }
        kind: { type: string, enum: [SWAP, TRANSFER] }
        status:
          type: string
          enum: [AWAITING_APPROVAL, SUBMITTING, SUBMITTED, CONFIRMING, SUCCEEDED, FAILED, UNKNOWN]
        txHash: { $ref: '#/components/schemas/Hash' }
        seraOrderId: { type: string }
        lastEvidence:
          type: object
          additionalProperties: false
          required: [type, checkedAt]
          properties:
            type: { type: string, enum: [SERA_RESPONSE, SERA_ORDER, SERA_FILL, RPC_RECEIPT, TIMEOUT] }
            reference: { type: string }
            checkedAt: { type: string, format: date-time }
        failureCode: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, operationId, action, outcome, correlationId, createdAt]
      properties:
        id: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        proposalId: { type: string, format: uuid }
        approvalId: { type: string, format: uuid }
        action:
          type: string
          enum: [PROPOSAL_CREATED, REJECTED, CANCELLED, APPROVAL_REQUESTED, SIGNATURE_ACCEPTED, SIGNATURE_REJECTED, SUBMIT_STARTED, SUBMIT_ACCEPTED, STATUS_CHANGED, RECHECK_REQUESTED]
        outcome: { type: string, enum: [SUCCEEDED, REJECTED, FAILED, UNKNOWN] }
        safeReference: { type: string, maxLength: 512 }
        correlationId: { type: string, minLength: 1, maxLength: 128 }
        createdAt: { type: string, format: date-time }
